<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Câmera Térmica 3D - WiFi Sensing</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            color: #00ff41;
            overflow: hidden;
            height: 100vh;
        }

        #container {
            display: flex;
            width: 100%;
            height: 100vh;
            gap: 0;
        }

        #thermal-viewport {
            flex: 1;
            position: relative;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            border-right: 2px solid #00ff41;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas-3d {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        .scanner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 65, 0.02) 0px,
                rgba(0, 255, 65, 0.02) 2px,
                transparent 2px,
                transparent 4px
            );
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        #control-panel {
            width: 100%;
            max-width: 350px;
            background: linear-gradient(180deg, #1a1f3a 0%, #0a0e27 100%);
            border-left: 2px solid #00ff41;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .panel-section {
            margin-bottom: 25px;
            border: 1px solid rgba(0, 255, 65, 0.3);
            padding: 15px;
            background: rgba(0, 255, 65, 0.05);
            border-radius: 5px;
        }

        .panel-title {
            font-weight: bold;
            margin-bottom: 12px;
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .info-line {
            margin: 8px 0;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-label {
            color: #00aa22;
            flex: 1;
        }

        .info-value {
            color: #00ff41;
            font-weight: bold;
            text-align: right;
            flex: 1;
        }

        .activity-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
        }

        .activity-walking {
            background: #ff6b35;
            color: #000;
        }

        .activity-sitting {
            background: #2ed573;
            color: #000;
        }

        .activity-standing {
            background: #667eea;
            color: #fff;
        }

        .activity-waiting {
            background: #666;
            color: #fff;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 70px;
            padding: 10px;
            background: linear-gradient(135deg, #00ff41 0%, #00aa22 100%);
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #00ff41;
        }

        button:active {
            transform: scale(0.95);
        }

        button.secondary {
            background: linear-gradient(135deg, #667eea 0%, #4c5fd5 100%);
            color: #fff;
        }

        button.secondary:hover {
            box-shadow: 0 0 15px #667eea;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1s infinite;
            background: #00ff41;
            box-shadow: 0 0 10px #00ff41;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .thermal-scale {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 4px;
            font-size: 11px;
        }

        .scale-row {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }

        .scale-color {
            width: 20px;
            height: 15px;
            border-radius: 2px;
            margin-right: 8px;
            border: 1px solid rgba(0, 255, 65, 0.5);
        }

        .event-log {
            flex: 1;
            margin-top: 20px;
            border: 1px solid rgba(0, 255, 65, 0.3);
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            overflow-y: auto;
            max-height: 150px;
        }

        .log-entry {
            font-size: 11px;
            margin: 4px 0;
            padding: 4px;
            border-left: 2px solid #00ff41;
            padding-left: 8px;
            color: #00aa22;
        }

        .log-time {
            color: #00ff41;
            font-weight: bold;
        }

        .distance-bar {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 4px;
        }

        .distance-label {
            font-size: 12px;
            margin-bottom: 5px;
            color: #00aa22;
        }

        .distance-bar-bg {
            width: 100%;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ff41;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .distance-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff41 0%, #ffff00 50%, #ff6b35 100%);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #00ff41;
        }

        .test-buttons {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .test-buttons button {
            flex: 1;
            padding: 8px;
            font-size: 11px;
        }

        .camera-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 1px solid #00ff41;
            border-radius: 4px;
            font-size: 11px;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            pointer-events: none;
            z-index: 100;
        }

        @media (max-width: 1024px) {
            #container {
                flex-direction: column;
            }

            #thermal-viewport {
                height: 60%;
                border-right: none;
                border-bottom: 2px solid #00ff41;
            }

            #control-panel {
                width: 100%;
                height: 40%;
                max-width: 100%;
                border-left: none;
                border-top: 2px solid #00ff41;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="thermal-viewport">
            <canvas id="canvas-3d"></canvas>
            <div class="scanner-overlay"></div>
            <div class="camera-info">
                <div>🔥 CÂMERA TÉRMICA 3D</div>
                <div id="fps-counter" style="color: #ffff00;">FPS: 60</div>
            </div>
        </div>

        <div id="control-panel">
            <div class="panel-section">
                <div class="panel-title">⚙️ STATUS</div>
                <div class="info-line">
                    <span class="info-label">
                        <span class="status-indicator"></span>
                        SISTEMA
                    </span>
                    <span class="info-value" id="system-status">ONLINE</span>
                </div>
            </div>

            <div class="panel-section">
                <div class="panel-title">📊 DADOS EM TEMPO REAL</div>
                <div class="info-line">
                    <span class="info-label">ATIVIDADE</span>
                    <span class="info-value" id="activity-text">AGUARDANDO</span>
                </div>
                <div id="activity-badge" class="activity-badge activity-waiting">WAITING</div>

                <div class="info-line" style="margin-top: 12px;">
                    <span class="info-label">RSSI (dBm)</span>
                    <span class="info-value" id="rssi-value">-60</span>
                </div>

                <div class="distance-bar">
                    <div class="distance-label">📏 DISTÂNCIA</div>
                    <div class="distance-bar-bg">
                        <div class="distance-bar-fill" id="distance-fill"></div>
                    </div>
                    <div style="text-align: center; margin-top: 5px; color: #00ff41; font-size: 12px;">
                        <span id="distance-value">0.0</span> m
                    </div>
                </div>

                <div class="info-line" style="margin-top: 12px;">
                    <span class="info-label">AMOSTRAS</span>
                    <span class="info-value" id="samples-value">0</span>
                </div>
            </div>

            <div class="panel-section">
                <div class="panel-title">🎮 SIMULAR ATIVIDADE</div>
                <div class="test-buttons">
                    <button onclick="simulateActivity('WALKING')" class="secondary">🚶</button>
                    <button onclick="simulateActivity('SITTING')" class="secondary">🪑</button>
                    <button onclick="simulateActivity('STANDING')" class="secondary">🧍</button>
                </div>
                <div class="button-group">
                    <button onclick="startContinuousWalk()">Animar Caminhando</button>
                    <button onclick="stopAnimation()">Parar</button>
                </div>
            </div>

            <div class="panel-section">
                <div class="panel-title">🌡️ ESCALA TÉRMICA</div>
                <div class="thermal-scale">
                    <div class="scale-row">
                        <div class="scale-color" style="background: #0000ff;"></div>
                        <span>Muito Frio (-70 dBm)</span>
                    </div>
                    <div class="scale-row">
                        <div class="scale-color" style="background: #00ff00;"></div>
                        <span>Médio (-60 dBm)</span>
                    </div>
                    <div class="scale-row">
                        <div class="scale-color" style="background: #ffff00;"></div>
                        <span>Quente (-50 dBm)</span>
                    </div>
                    <div class="scale-row">
                        <div class="scale-color" style="background: #ff6b35;"></div>
                        <span>Muito Quente (-40 dBm)</span>
                    </div>
                </div>
            </div>

            <div class="event-log">
                <div class="panel-title">📋 LOG DE EVENTOS</div>
                <div id="log-container"></div>
            </div>
        </div>
    </div>

    <script>
        // 3D Scene Setup
        let scene, camera, renderer;
        let thermalPlane, thermalTexture, textureCanvas, textureCtx;
        let frameCount = 0, lastFpsTime = Date.now();
        let animationRunning = false;

        // State
        let currentActivity = "WAITING";
        let currentRSSI = -60;
        let samplesCount = 0;

        function initThreeJS() {
            const canvas = document.getElementById('canvas-3d');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e27);
            scene.fog = new THREE.Fog(0x0a0e27, 100, 200);

            camera = new THREE.PerspectiveCamera(
                75,
                canvas.clientWidth / canvas.clientHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 8);

            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: true,
                alpha: false
            });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.toneMapping = THREE.ReinhardToneMapping;
            renderer.toneMappingExposure = 1.0;

            createThermalScene();
            setupLighting();
            animationLoop();
        }

        function createThermalScene() {
            textureCanvas = document.createElement('canvas');
            textureCanvas.width = 512;
            textureCanvas.height = 512;
            textureCtx = textureCanvas.getContext('2d');

            const geometry = new THREE.PlaneGeometry(16, 12);
            const material = new THREE.MeshStandardMaterial({
                emissiveIntensity: 1.0,
                metalness: 0.1,
                roughness: 0.8
            });

            updateThermalTexture();
            thermalPlane = new THREE.Mesh(geometry, material);
            scene.add(thermalPlane);
        }

        function createThermalTexture(intensity, offsetX = 0) {
            textureCtx.fillStyle = '#000a14';
            textureCtx.fillRect(0, 0, textureCanvas.width, textureCanvas.height);

            const centerX = textureCanvas.width / 2 + offsetX;
            const centerY = textureCanvas.height / 2;

            const rssiNormalized = Math.max(0, Math.min(1, (currentRSSI + 80) / 40));

            const gradient = textureCtx.createRadialGradient(
                centerX, centerY, 10,
                centerX, centerY, 200
            );

            const color1 = rssiToThermalColor(rssiNormalized, 1.0);
            const color2 = rssiToThermalColor(rssiNormalized, 0.6);
            const color3 = rssiToThermalColor(rssiNormalized, 0.2);

            gradient.addColorStop(0, color1);
            gradient.addColorStop(0.5, color2);
            gradient.addColorStop(1, color3);

            textureCtx.fillStyle = gradient;
            textureCtx.fillRect(0, 0, textureCanvas.width, textureCanvas.height);

            if (currentActivity === 'WALKING') {
                drawWalkingSignature(textureCtx, centerX, centerY, rssiNormalized);
            } else if (currentActivity === 'SITTING') {
                drawSittingSignature(textureCtx, centerX, centerY, rssiNormalized);
            } else if (currentActivity === 'STANDING') {
                drawStandingSignature(textureCtx, centerX, centerY, rssiNormalized);
            }

            thermalTexture = new THREE.CanvasTexture(textureCanvas);
            thermalTexture.magFilter = THREE.LinearFilter;
            thermalTexture.minFilter = THREE.LinearFilter;
            thermalPlane.material.emissiveMap = thermalTexture;
            thermalPlane.material.needsUpdate = true;
        }

        function drawWalkingSignature(ctx, centerX, centerY, intensity) {
            const offset = Math.sin(Date.now() / 400) * 80;

            ctx.fillStyle = rssiToThermalColor(intensity * 0.95, 0.8);
            ctx.beginPath();
            ctx.ellipse(centerX + offset, centerY - 100, 40, 50, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = rssiToThermalColor(intensity, 0.9);
            ctx.beginPath();
            ctx.ellipse(centerX + offset * 0.5, centerY, 60, 80, 0, 0, Math.PI * 2);
            ctx.fill();

            const legOffset = Math.sin(Date.now() / 300) * 30;
            ctx.fillStyle = rssiToThermalColor(intensity * 0.85, 0.7);
            ctx.beginPath();
            ctx.ellipse(centerX + offset + legOffset, centerY + 100, 35, 60, 0.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(centerX + offset - legOffset, centerY + 100, 35, 60, -0.2, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawSittingSignature(ctx, centerX, centerY, intensity) {
            ctx.fillStyle = rssiToThermalColor(intensity * 0.95, 0.8);
            ctx.beginPath();
            ctx.ellipse(centerX, centerY - 80, 40, 50, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = rssiToThermalColor(intensity, 0.9);
            ctx.beginPath();
            ctx.ellipse(centerX, centerY + 20, 70, 70, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = rssiToThermalColor(intensity * 0.8, 0.7);
            ctx.beginPath();
            ctx.ellipse(centerX - 50, centerY + 120, 30, 40, -0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(centerX + 50, centerY + 120, 30, 40, 0.3, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawStandingSignature(ctx, centerX, centerY, intensity) {
            ctx.fillStyle = rssiToThermalColor(intensity * 0.95, 0.8);
            ctx.beginPath();
            ctx.ellipse(centerX, centerY - 100, 40, 50, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = rssiToThermalColor(intensity, 0.9);
            ctx.beginPath();
            ctx.ellipse(centerX, centerY, 55, 85, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = rssiToThermalColor(intensity * 0.85, 0.7);
            ctx.beginPath();
            ctx.ellipse(centerX - 30, centerY + 110, 28, 65, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(centerX + 30, centerY + 110, 28, 65, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function rssiToThermalColor(intensity, alpha = 1.0) {
            let r, g, b;

            if (intensity < 0.2) {
                r = 0; g = 0; b = 255;
            } else if (intensity < 0.4) {
                r = 0; g = 200; b = 100;
            } else if (intensity < 0.6) {
                r = 0; g = 255; b = 0;
            } else if (intensity < 0.8) {
                r = 255; g = 255; b = 0;
            } else {
                r = 255; g = 100; b = 0;
            }

            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0x00ff41, 0.4);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x00ff41, 2, 100);
            pointLight.position.set(0, 0, 15);
            scene.add(pointLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.3);
            dirLight.position.set(10, 10, 15);
            scene.add(dirLight);
        }

        function updateThermalTexture() {
            const offsetX = currentActivity === 'WALKING' && animationRunning ? Math.sin(Date.now() / 400) * 30 : 0;
            createThermalTexture(1.0, offsetX);
        }

        function animationLoop() {
            requestAnimationFrame(animationLoop);

            updateThermalTexture();

            camera.position.x = Math.sin(Date.now() / 8000) * 0.5;
            camera.position.y = Math.cos(Date.now() / 10000) * 0.3;

            thermalPlane.rotation.z += 0.0001;

            renderer.render(scene, camera);

            frameCount++;
            const now = Date.now();
            if (now - lastFpsTime >= 1000) {
                document.getElementById('fps-counter').textContent = `FPS: ${frameCount}`;
                frameCount = 0;
                lastFpsTime = now;
            }
        }

        function updateUI() {
            const activity = currentActivity;
            document.getElementById('activity-text').textContent = activity;

            const badge = document.getElementById('activity-badge');
            badge.textContent = activity;
            badge.className = 'activity-badge activity-' + activity.toLowerCase();

            document.getElementById('rssi-value').textContent = currentRSSI;

            const distance = calculateDistance(currentRSSI);
            document.getElementById('distance-value').textContent = distance.toFixed(1);
            document.getElementById('distance-fill').style.width = Math.min(100, distance * 10) + '%';

            document.getElementById('samples-value').textContent = samplesCount;
        }

        function calculateDistance(rssi) {
            const refRSSI = -50;
            const n = 2;
            if (rssi === 0) return 0;
            return Math.pow(10, (refRSSI - rssi) / (10 * n));
        }

        function addLog(message) {
            const container = document.getElementById('log-container');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString('pt-BR');
            entry.innerHTML = `<span class="log-time">${time}</span> - ${message}`;
            container.insertBefore(entry, container.firstChild);

            if (container.children.length > 10) {
                container.removeChild(container.lastChild);
            }
        }

        function simulateActivity(activity) {
            currentActivity = activity;
            animationRunning = false;

            const rssiValues = {
                'WALKING': -55 + Math.random() * 10,
                'SITTING': -60 + Math.random() * 10,
                'STANDING': -58 + Math.random() * 10
            };

            currentRSSI = rssiValues[activity] || -60;
            samplesCount += Math.floor(Math.random() * 5) + 1;
            updateUI();
            addLog(`📊 ${activity} | RSSI: ${currentRSSI.toFixed(0)}`);
        }

        function startContinuousWalk() {
            currentActivity = 'WALKING';
            currentRSSI = -55;
            animationRunning = true;
            samplesCount = 0;
            addLog('🚶 Iniciando caminhada contínua...');
            updateUI();

            let walkStep = 0;
            const walkInterval = setInterval(() => {
                if (!animationRunning) {
                    clearInterval(walkInterval);
                    return;
                }
                walkStep++;
                currentRSSI = -55 + Math.sin(walkStep / 20) * 10;
                samplesCount = walkStep;
                updateUI();
            }, 100);
        }

        function stopAnimation() {
            animationRunning = false;
            currentActivity = 'WAITING';
            currentRSSI = -70;
            addLog('⏹️ Animação parada');
            updateUI();
        }

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('canvas-3d');
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        window.addEventListener('load', () => {
            initThreeJS();
            updateUI();
            addLog('🔥 Câmera Térmica 3D Iniciada');
            addLog('✓ Sistema Pronto');
        });
    </script>
</body>
</html>
