<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🚶 Visualizador de Pose</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.8em;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f5f5f5;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4757;
            animation: pulse 2s infinite;
        }

        .status-dot.online {
            background: #2ed573;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Visualizador de Pose */
        .pose-display {
            background: linear-gradient(180deg, #f0f0f0 0%, #e8e8e8 100%);
            border-radius: 16px;
            padding: 40px 20px;
            margin: 30px 0;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .pose-canvas {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }

        .activity-text {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .distance-info {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #ddd;
        }

        .distance-item {
            flex: 1;
        }

        .distance-label {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 5px;
        }

        .distance-value {
            font-size: 1.6em;
            font-weight: bold;
            color: #667eea;
        }

        .distance-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }

        .distance-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #2ed573 0%, #ffa502 50%, #ff4757 100%);
            transition: width 0.3s ease;
        }

        /* Cards de Info */
        .info-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 25px;
        }

        .info-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .info-card-label {
            font-size: 0.8em;
            opacity: 0.9;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-card-value {
            font-size: 1.5em;
            font-weight: bold;
        }

        /* Indicadores de Atividade */
        .activity-indicators {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .indicator {
            width: 60px;
            height: 80px;
            background: #f5f5f5;
            border: 3px solid #ddd;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.8em;
        }

        .indicator.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .indicator-label {
            font-size: 0.65em;
            margin-top: 5px;
            font-weight: 600;
        }

        /* Controles */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        .btn-connect {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-connect:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-load {
            background: #e8f0f7;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-load:hover {
            background: #667eea;
            color: white;
        }

        .log-box {
            background: #1e1e1e;
            color: #00ff00;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
            height: 100px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .log-entry {
            margin: 3px 0;
        }

        .log-time {
            color: #888;
            margin-right: 8px;
        }

        /* Animação de Respiração */
        @keyframes breathe {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .breathing {
            animation: breathe 2s ease-in-out infinite;
        }

        /* Responsivo */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.4em;
            }

            .pose-display {
                min-height: 300px;
                padding: 30px 15px;
            }

            .activity-text {
                font-size: 1.6em;
            }

            .info-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚶 Visualizador de Pose</h1>

        <div class="status-bar">
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Conectando...</span>
            </div>
            <div class="status-badge">
                📊 Buffer: <span id="bufferCount">0</span>
            </div>
        </div>

        <!-- Visualização Principal -->
        <div class="pose-display">
            <div class="activity-text" id="activityText">AGUARDANDO</div>
            <canvas id="poseCanvas" class="pose-canvas"></canvas>

            <div class="distance-info">
                <div class="distance-item">
                    <div class="distance-label">Distância</div>
                    <div class="distance-value" id="distanceValue">--</div>
                    <div class="distance-bar">
                        <div class="distance-bar-fill" id="distanceBar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="distance-item">
                    <div class="distance-label">RSSI</div>
                    <div class="distance-value" id="rssiValue">--</div>
                </div>
            </div>
        </div>

        <!-- Indicadores de Atividade -->
        <div class="activity-indicators">
            <div class="indicator" data-activity="walking" onclick="testActivity('walking')">
                <span>🚶</span>
                <div class="indicator-label">Walk</div>
            </div>
            <div class="indicator" data-activity="sitting" onclick="testActivity('sitting')">
                <span>🪑</span>
                <div class="indicator-label">Sit</div>
            </div>
            <div class="indicator" data-activity="standing" onclick="testActivity('standing')">
                <span>🧍</span>
                <div class="indicator-label">Stand</div>
            </div>
        </div>

        <!-- Controles -->
        <div class="controls">
            <button class="btn-connect" onclick="connectSerial()">🔌 Conectar</button>
            <button class="btn-load" onclick="loadModel()">🤖 Carregar</button>
        </div>

        <!-- Info Cards -->
        <div class="info-cards">
            <div class="info-card">
                <div class="info-card-label">Conexão</div>
                <div class="info-card-value" id="connStatus">✗</div>
            </div>
            <div class="info-card">
                <div class="info-card-label">Modelo</div>
                <div class="info-card-value" id="modelStatus">✗</div>
            </div>
        </div>

        <!-- Log -->
        <div class="log-box" id="eventLog">
            <div class="log-entry">
                <span class="log-time">[INIT]</span>
                <span>Dashboard iniciado</span>
            </div>
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // WebSocket & Canvas Setup
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const socket = io();
        const canvas = document.getElementById('poseCanvas');
        const ctx = canvas.getContext('2d');
        let currentActivity = 'waiting';
        let currentRSSI = 0;

        // Redimensionar canvas
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // Desenhar Silhueta
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function drawStickFigure(activity) {
            const w = canvas.width;
            const h = canvas.height;

            // Limpar canvas
            ctx.fillStyle = 'rgba(240, 240, 240, 0)';
            ctx.clearRect(0, 0, w, h);

            const centerX = w / 2;
            const centerY = h / 2.5;
            const headRadius = 25;
            const bodyLength = 60;
            const armLength = 35;
            const legLength = 50;

            // Cores e estilos
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.fillStyle = 'rgba(102, 126, 234, 0.2)';

            // Cabeça
            ctx.beginPath();
            ctx.arc(centerX, centerY - bodyLength - 30, headRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Corpo
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - bodyLength - 5);
            ctx.lineTo(centerX, centerY + 10);
            ctx.stroke();

            // Desenhar baseado na atividade
            if (activity === 'standing') {
                drawStanding(centerX, centerY, armLength, legLength);
            } else if (activity === 'sitting') {
                drawSitting(centerX, centerY, armLength, legLength);
            } else if (activity === 'walking') {
                drawWalking(centerX, centerY, armLength, legLength);
            } else {
                drawWaiting(centerX, centerY, armLength, legLength);
            }

            // Adicionar brilho
            ctx.strokeStyle = '#764ba2';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.5;
            ctx.beginPath();
            ctx.arc(centerX, centerY - bodyLength - 30, headRadius - 5, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
        }

        function drawStanding(centerX, centerY, armLength, legLength) {
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 4;

            // Braços caídos
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - 40);
            ctx.lineTo(centerX - armLength, centerY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(centerX, centerY - 40);
            ctx.lineTo(centerX + armLength, centerY);
            ctx.stroke();

            // Pernas
            ctx.beginPath();
            ctx.moveTo(centerX - 10, centerY + 10);
            ctx.lineTo(centerX - 10, centerY + legLength);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(centerX + 10, centerY + 10);
            ctx.lineTo(centerX + 10, centerY + legLength);
            ctx.stroke();
        }

        function drawSitting(centerX, centerY, armLength, legLength) {
            ctx.strokeStyle = '#2ed573';
            ctx.lineWidth = 4;

            // Braços descansados
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - 30);
            ctx.lineTo(centerX - armLength * 0.7, centerY + 20);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(centerX, centerY - 30);
            ctx.lineTo(centerX + armLength * 0.7, centerY + 20);
            ctx.stroke();

            // Pernas dobradas
            ctx.beginPath();
            ctx.moveTo(centerX - 10, centerY + 10);
            ctx.lineTo(centerX - 20, centerY + 40);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(centerX + 10, centerY + 10);
            ctx.lineTo(centerX + 20, centerY + 40);
            ctx.stroke();

            // Banco
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(centerX - 40, centerY + 50);
            ctx.lineTo(centerX + 40, centerY + 50);
            ctx.stroke();
        }

        function drawWalking(centerX, centerY, armLength, legLength) {
            ctx.strokeStyle = '#ffa502';
            ctx.lineWidth = 4;

            // Braços em movimento
            const time = Date.now() / 500 % Math.PI * 2;
            const armRotation = Math.sin(time) * 20;

            ctx.beginPath();
            ctx.moveTo(centerX, centerY - 40);
            ctx.lineTo(centerX - armLength + armRotation, centerY - 5);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(centerX, centerY - 40);
            ctx.lineTo(centerX + armLength - armRotation, centerY - 5);
            ctx.stroke();

            // Pernas em movimento
            const legRotation = Math.sin(time + Math.PI / 2) * 15;

            ctx.beginPath();
            ctx.moveTo(centerX - 5, centerY + 10);
            ctx.lineTo(centerX - 5 + legRotation, centerY + legLength);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(centerX + 5, centerY + 10);
            ctx.lineTo(centerX + 5 - legRotation, centerY + legLength);
            ctx.stroke();
        }

        function drawWaiting(centerX, centerY, armLength, legLength) {
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 4;

            // Braços
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - 40);
            ctx.lineTo(centerX - armLength, centerY - 20);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(centerX, centerY - 40);
            ctx.lineTo(centerX + armLength, centerY - 20);
            ctx.stroke();

            // Pernas
            ctx.beginPath();
            ctx.moveTo(centerX - 5, centerY + 10);
            ctx.lineTo(centerX - 5, centerY + legLength);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(centerX + 5, centerY + 10);
            ctx.lineTo(centerX + 5, centerY + legLength);
            ctx.stroke();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // Calcular Distância a partir de RSSI
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function calculateDistance(rssi) {
            // Fórmula: distance = 10^((refRSSI - rssi) / (10 * n))
            const refRSSI = -50; // RSSI a 1 metro
            const pathLossExponent = 2; // Ambiente livre
            const distance = Math.pow(10, ((refRSSI - rssi) / (10 * pathLossExponent)));
            return Math.max(0, Math.min(10, distance)); // 0 a 10 metros
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // WebSocket Events
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        socket.on('connect', () => {
            log('✓ Conectado ao servidor', 'success');
            updateConnectionStatus(true);
        });

        socket.on('disconnect', () => {
            log('✗ Desconectado', 'error');
            updateConnectionStatus(false);
        });

        socket.on('activity_detected', (data) => {
            currentActivity = data.activity;
            currentRSSI = data.rssi;

            updateUI(data.activity, data.rssi, data.buffer_size);
        });

        socket.on('model_loaded', (data) => {
            if (data.success) {
                document.getElementById('modelStatus').textContent = '✓';
                log('✓ Modelo carregado', 'success');
            } else {
                log('✗ Erro ao carregar modelo', 'error');
            }
        });

        socket.on('connection_status', (data) => {
            if (data.connected) {
                document.getElementById('connStatus').textContent = '✓';
                log('✓ Serial conectado', 'success');
            } else {
                document.getElementById('connStatus').textContent = '✗';
            }
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // Atualizar UI
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function updateUI(activity, rssi, bufferSize) {
            // Atualizar texto
            document.getElementById('activityText').textContent = activity.toUpperCase();
            document.getElementById('rssiValue').textContent = rssi + ' dBm';
            document.getElementById('bufferCount').textContent = bufferSize;

            // Calcular distância
            const distance = calculateDistance(rssi);
            document.getElementById('distanceValue').textContent = distance.toFixed(1) + ' m';

            // Atualizar barra de distância (0-10m)
            const barWidth = (distance / 10) * 100;
            document.getElementById('distanceBar').style.width = barWidth + '%';

            // Atualizar indicadores
            document.querySelectorAll('.indicator').forEach(ind => {
                ind.classList.remove('active');
            });
            document.querySelector(`[data-activity="${activity}"]`)?.classList.add('active');

            // Desenhar silhueta
            drawStickFigure(activity);
        }

        function updateConnectionStatus(online) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (online) {
                dot.classList.add('online');
                text.textContent = '✓ Online';
            } else {
                dot.classList.remove('online');
                text.textContent = '✗ Offline';
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // Funções de Controle
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        async function connectSerial() {
            try {
                const response = await fetch('/api/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ port: '/dev/ttyUSB0', baud: 115200 })
                });
                if (response.ok) {
                    log('✓ Conectado', 'success');
                }
            } catch (error) {
                log('✗ Erro: ' + error.message, 'error');
            }
        }

        async function loadModel() {
            try {
                const response = await fetch('/api/model/load', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: 'model.pkl' })
                });
                if (response.ok) {
                    log('✓ Modelo carregado', 'success');
                }
            } catch (error) {
                log('✗ Erro: ' + error.message, 'error');
            }
        }

        function testActivity(activity) {
            // Para testes sem ESP32
            updateUI(activity, -50 - Math.random() * 30, 42);
            log(`📤 Teste: ${activity}`, 'info');
        }

        function log(message, type = 'info') {
            const logBox = document.getElementById('eventLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString('pt-BR');
            entry.innerHTML = `<span class="log-time">[${time}]</span> ${message}`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;

            while (logBox.children.length > 10) {
                logBox.removeChild(logBox.firstChild);
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // Inicialização
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        window.addEventListener('load', () => {
            drawStickFigure('waiting');
            log('🚀 Visualizador iniciado', 'success');

            // Animar walking
            setInterval(() => {
                if (currentActivity === 'walking') {
                    drawStickFigure('walking');
                }
            }, 50);

            // Atualizar dados
            setInterval(() => {
                socket.emit('request_update');
            }, 500);
        });
    </script>
</body>
</html>
